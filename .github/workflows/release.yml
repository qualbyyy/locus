name: Release Linux

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  linux-bundles:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Linux Tauri dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            rpm

      - name: Install npm dependencies
        run: npm ci

      - name: Run checks and unit tests
        run: |
          npm test
          npx tsc --noEmit

      - name: Build Linux packages (deb, rpm, AppImage)
        run: npm run tauri build -- --bundles deb,rpm,appimage

      - name: Upload Linux release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locus-linux-bundles
          path: |
            src-tauri/target/release/bundle/deb/*.deb
            src-tauri/target/release/bundle/rpm/*.rpm
            src-tauri/target/release/bundle/appimage/*.AppImage

  windows-bundles:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install npm dependencies
        run: npm ci

      - name: Run checks and unit tests
        run: |
          npm test
          npx tsc --noEmit

      - name: Build Windows packages (exe, msi)
        run: npm run tauri build -- --bundles nsis,msi

      - name: Upload Windows release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: locus-windows-bundles
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
